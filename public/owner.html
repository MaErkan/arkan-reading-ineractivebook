<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0B7C82">
<title>لوحة المالك – أركان</title>
<style>
:root{--bg:#EEF5F3;--card:#fff;--ink:#12302f;--mut:#5b7775;--teal:#0B7C82;--ok:#1D7A55;--bad:#C9442A;--warn:#B7791F;--line:#d6e4e0;--soft:#e6f1ee}
@media (prefers-color-scheme:dark){:root{--bg:#0C1A1D;--card:#14282b;--ink:#e6f2ef;--mut:#92b0ac;--line:#294045;--soft:#1b3438}}
[hidden]{display:none!important}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Tajawal","Segoe UI",Tahoma,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--teal);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;gap:8px;align-items:center}
header h1{margin:0;font-size:18px;flex:1}
main{max-width:980px;margin:0 auto;padding:12px 12px 60px}
button{font:700 14px inherit;font-family:inherit;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;background:var(--teal);color:#fff}
button.ghost{background:transparent;color:inherit;border:1.5px solid var(--line)}header button.ghost{color:#fff;border-color:#ffffff88}
input,select{font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px;line-height:1.2}.stat span{font-size:13px;color:var(--mut)}
h2{font-size:17px;margin:18px 2px 6px}.mut{color:var(--mut);font-size:13px}
.bar{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--soft)}
.bar i{display:block}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin-top:6px}.legend em{font-style:normal}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:4px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.tools input{flex:1;min-width:140px}
.row{display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}.row:active{background:var(--soft)}.row .nm{flex:1;min-width:0}.row .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--soft)}
.p-advanced,.p-improving,.p-up{background:#1d7a5522;color:var(--ok)}.p-support,.p-declining,.p-down,.p-stuck,.p-weak{background:#c9442a22;color:var(--bad)}.p-mid,.p-flat,.p-stable,.p-ok{background:#b7791f22;color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 6px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}th{color:var(--mut);font-weight:700;font-size:12px}
.sx{overflow-x:auto}
.modal{position:fixed;inset:0;z-index:20;background:#000a;display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:var(--bg);width:100%;max-width:820px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
.summary{background:var(--soft);border-radius:12px;padding:12px;line-height:1.9}
.heat{display:grid;grid-template-columns:repeat(15,1fr);gap:3px}.heat i{aspect-ratio:1;border-radius:3px;background:var(--soft)}
#login{max-width:360px;margin:70px auto;text-align:center}#err{color:var(--bad);min-height:22px}
@media print{header,.tools,button{display:none!important}}
</style></head><body>
<header><h1>📊 لوحة المالك – أركان</h1><button class="ghost" id="rf" hidden>↻</button><button class="ghost" id="csv" hidden>CSV</button><button class="ghost" id="out" hidden>خروج</button></header>
<main>
<div id="login" class="card"><p>أدخل مفتاح المالك</p><input id="key" type="password" autocomplete="off" placeholder="المفتاح السري" style="width:100%"><p id="err"></p><button id="go" style="width:100%">دخول</button></div>
<div id="app" hidden>
 <div class="grid" id="stats"></div>
 <h2>توزيع المستويات</h2><div class="card"><div class="bar" id="lvbar"></div><div class="legend" id="lvleg"></div></div>
 <h2>متوسط الدفعة حسب القسم</h2><div class="grid" id="grps"></div>
 <h2>الأقسام الأضعف عند الدفعة</h2><div class="card sx"><table id="secs"></table></div>
 <h2>الطلاب</h2>
 <div class="tools"><input id="q" placeholder="ابحث بالاسم أو الإيميل"><select id="fl"><option value="">كل المستويات</option><option value="support">يحتاج دعمًا</option><option value="mid">متوسط</option><option value="advanced">متقدم</option><option value="unrated">لم يُقيَّم</option></select><select id="ft"><option value="">كل الاتجاهات</option><option value="up">صاعد</option><option value="down">متراجع</option><option value="flat">ثابت</option></select></div>
 <div class="card" id="list" style="padding:0"></div>
 <p class="mut" id="at"></p>
</div></main>
<div class="modal" id="md" hidden><div id="mc"></div></div>
<script>
const $=id=>document.getElementById(id);let KEY=sessionStorage.getItem('ok')||'',DATA=null;
const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const LV={advanced:'متقدم',mid:'متوسط',support:'يحتاج دعمًا',unrated:'لم يُقيَّم'},LC={advanced:'#1D7A55',mid:'#B7791F',support:'#C9442A',unrated:'#8aa5a1'};
const TR={up:'صاعد ▲',down:'متراجع ▼',flat:'ثابت ●'};
const ST={improving:'تحسّن',declining:'تراجع',stuck:'ثابت وضعيف',stable:'مستقر',weak:'ضعيف',ok:'جيد',reading:'قرأ فقط',none:'—'};
const ago=d=>d==null?'—':d===0?'اليوم':d===1?'أمس':'منذ '+d+' يوم';
const fd=t=>t?new Date(t).toLocaleDateString('ar-EG',{day:'numeric',month:'short'}):'—';
async function load(){
  const r=await fetch('/api/owner',{headers:{'x-owner-key':encodeURIComponent(KEY)}});
  if(r.status===403){sessionStorage.removeItem('ok');show(false);$('err').textContent='المفتاح غير صحيح';return}
  if(r.status===503){show(false);$('err').textContent='لم يُضبط OWNER_KEY في Netlify بعد';return}
  if(!r.ok){$('err').textContent='تعذّر التحميل';show(false);return}
  DATA=await r.json();show(true);render();
}
function show(on){$('login').hidden=on;$('app').hidden=!on;['rf','csv','out'].forEach(i=>$(i).hidden=!on)}
function render(){
  const t=DATA.totals,L=DATA.levels,n=Math.max(1,t.registered);
  const S=[['المسجّلون',t.registered],['فعّلوا الإيميل',t.verified],['نشطون اليوم',t.active1],['نشطون هذا الأسبوع',t.active7],['منقطعون +14 يوم',t.dormant],['لم يختبروا بعد',t.neverTested],['متوسط الدرجات',t.avgScore==null?'—':t.avgScore+'%'],['في صعود',t.improving],['في تراجع',t.declining],['محاولات دخول فاشلة',t.unlockFails]];
  $('stats').innerHTML=S.map(([a,b])=>`<div class="stat"><b>${b}</b><span>${a}</span></div>`).join('');
  $('lvbar').innerHTML=Object.keys(LV).map(k=>`<i style="width:${L[k]/n*100}%;background:${LC[k]}"></i>`).join('');
  $('lvleg').innerHTML=Object.keys(LV).map(k=>`<em><span class="dot" style="background:${LC[k]}"></span>${LV[k]}: ${L[k]}</em>`).join('');
  $('grps').innerHTML=DATA.groups.filter(g=>g.avg!=null).map(g=>`<div class="stat"><b>${g.avg}%</b><span>${esc(g.group)}</span></div>`).join('')||'<p class="mut">لا نتائج بعد</p>';
  const rows=DATA.sections.filter(s=>s.tested).slice(0,8);
  $('secs').innerHTML=rows.length?'<tr><th>القسم / المعيار</th><th>متوسط</th><th>اختبروا</th><th>متعثرون</th><th>أخطاء</th></tr>'+rows.map(s=>`<tr><td>${esc(s.sec)}<div class="mut">${esc(s.group)}</div></td><td><b>${s.avg}%</b></td><td>${s.tested}</td><td>${s.weak}</td><td>${s.errs}</td></tr>`).join(''):'<tr><td class="mut">لا توجد نتائج اختبارات بعد</td></tr>';
  list();$('at').textContent='آخر تحديث: '+new Date(DATA.at).toLocaleString('ar-EG');
}
function list(){
  const q=$('q').value.trim().toLowerCase(),fl=$('fl').value,ft=$('ft').value;
  const a=DATA.students.filter(s=>(!q||(s.name+' '+s.email).toLowerCase().includes(q))&&(!fl||s.level===fl)&&(!ft||s.trend===ft));
  $('list').innerHTML=a.map(s=>`<div class="row" data-d="${esc(s.did)}"><div class="nm"><b>${esc(s.name)}</b><span class="mut">${ago(s.lastSeenDays)} · ${s.testsCount} اختبار${s.verified?' · ✓':''}</span></div>${s.trend?`<span class="pill p-${s.trend}">${TR[s.trend]}</span>`:''}<span class="pill p-${s.level}">${LV[s.level]}${s.score!=null?' '+Math.round(s.score)+'%':''}</span></div>`).join('')||'<p class="mut" style="padding:14px">لا نتائج</p>';
}
function spark(ser){
  if(!ser||ser.length<2)return ser&&ser.length?`<span class="mut">${ser[0].pc}%</span>`:'';
  const w=90,h=26,p=ser.map((x,i)=>[i*(w-6)/(ser.length-1)+3,h-3-x.pc/100*(h-6)]);
  const c=ser[ser.length-1].pc>=ser[0].pc?'#1D7A55':'#C9442A';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="${c}" stroke-width="2" points="${p.map(x=>x.join(',')).join(' ')}"/><circle cx="${p[p.length-1][0]}" cy="${p[p.length-1][1]}" r="3" fill="${c}"/></svg>`;
}
function detail(did){
  const s=DATA.students.find(x=>x.did===did);if(!s)return;
  const today=new Date();let heat='';
  for(let i=29;i>=0;i--){const d=new Date(today-i*864e5).toISOString().slice(0,10),n=s.days[d]||0;heat+=`<i title="${d}: ${n}" style="${n?`background:var(--teal);opacity:${Math.min(1,.3+n/12)}`:''}"></i>`}
  const ph=s.phone.replace(/[^\d]/g,'');
  $('mc').innerHTML=`<div style="display:flex;gap:8px;align-items:center"><h2 style="margin:0;flex:1">${esc(s.name)}</h2><button class="ghost" id="cl">إغلاق</button></div>
  <p class="mut">${esc(s.email)} ${s.verified?'✓':'(غير مفعّل)'} · ${esc(s.phone)} · أول دخول ${fd(s.first)} · آخر ظهور ${ago(s.lastSeenDays)}</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">${s.email?`<a href="mailto:${esc(s.email)}"><button class="ghost">✉ إيميل</button></a>`:''}${ph?`<a href="tel:+${ph}"><button class="ghost">📞 اتصال</button></a><a href="https://wa.me/${ph}" target="_blank" rel="noopener"><button class="ghost">واتساب</button></a>`:''}</div>
  <div class="grid"><div class="stat"><b>${s.score==null?'—':Math.round(s.score)+'%'}</b><span>المستوى: ${LV[s.level]}</span></div><div class="stat"><b>${s.trend?TR[s.trend]:'—'}</b><span>الاتجاه${s.trendDelta!=null?' ('+(s.trendDelta>0?'+':'')+s.trendDelta+')':''}</span></div><div class="stat"><b>${s.accuracy==null?'—':s.accuracy+'%'}</b><span>دقة الإجابات</span></div><div class="stat"><b>${s.sessions}</b><span>جلسات</span></div></div>
  <h2>التحليل الشامل</h2><div class="summary">${esc(s.summary)}</div>
  <h2>التطور في كل قسم / معيار</h2><div class="card sx"><table><tr><th>القسم</th><th>أول</th><th>آخر</th><th>التغير</th><th>الحالة</th><th>المسار</th></tr>${s.sections.map(x=>`<tr><td>${esc(x.label)}<div class="mut">${esc(x.group)}</div></td><td>${x.first==null?'—':x.first+'%'}</td><td>${x.last==null?'—':x.last+'%'}</td><td>${x.delta==null?'—':(x.delta>0?'+':'')+x.delta}</td><td><span class="pill p-${x.status}">${ST[x.status]}</span></td><td>${spark(x.series)}</td></tr>`).join('')||'<tr><td class="mut">لا أنشطة بعد</td></tr>'}</table></div>
  <h2>النشاط آخر 30 يومًا</h2><div class="card"><div class="heat">${heat}</div></div>
  ${s.topErrors.length?`<h2>آخر الأخطاء</h2><div class="card">${s.topErrors.map(e=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><b>${esc((e.sec||'').replace(/[\u064B-\u0652\u0670\u0640]/g,''))}</b> <span class="mut">${fd(e.ts)}</span><div>${esc(e.q)}</div></div>`).join('')}</div>`:''}`;
  $('md').hidden=false;$('cl').onclick=()=>$('md').hidden=true;
}
$('go').onclick=()=>{KEY=$('key').value.trim();if(!KEY)return;sessionStorage.setItem('ok',KEY);$('err').textContent='';load()};
$('key').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
$('out').onclick=()=>{sessionStorage.removeItem('ok');KEY='';DATA=null;$('key').value='';$('md').hidden=true;$('mc').replaceChildren();$('list').replaceChildren();show(false)};
$('rf').onclick=load;['q','fl','ft'].forEach(i=>$(i).oninput=list);
$('list').onclick=e=>{const r=e.target.closest('[data-d]');if(r)detail(r.dataset.d)};
$('md').onclick=e=>{if(e.target===$('md'))$('md').hidden=true};
$('csv').onclick=()=>{const h=['الاسم','الإيميل','الجوال','المستوى','الدرجة','الاتجاه','اختبارات','جلسات','آخر ظهور (أيام)'];
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const b=new Blob(['\ufeff'+[h.map(q).join(',')].concat(DATA.students.map(s=>[s.name,s.email,s.phone,LV[s.level],s.score,s.trend?TR[s.trend]:'',s.testsCount,s.sessions,s.lastSeenDays].map(q).join(','))).join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='arkan-students.csv';a.click()};
if(KEY)load();
</script></body></html>
