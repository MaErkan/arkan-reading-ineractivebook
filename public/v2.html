<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#06292D">
<title>أركان التفاعلي في القراءة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@500;600;700&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
[hidden]{display:none!important}
:root{
  --bg:#EEF4F2;--surf:#fff;--ink:#0E2E33;--mut:#53706F;--line:#D3E2DE;--soft:#E3EFEB;
  --deep:#06292D;--teal:#0B7C82;--teal2:#0F9AA0;--sun:#F2A900;--sun-soft:#FFF1CC;
  --ok:#14966B;--ok-soft:#DDF5EB;--mid:#C98500;--mid-soft:#FFF0C9;--bad:#D6452B;--bad-soft:#FDE3DD;
  --r:18px;--sh:0 1px 2px rgba(6,41,45,.07),0 18px 40px -26px rgba(6,41,45,.45);
  --fd:"Reem Kufi","Tajawal",sans-serif;--fu:"Tajawal","Segoe UI",Tahoma,sans-serif;--ft:"Amiri","Traditional Arabic",serif;
  --fs:21px;
}
:root[data-theme=dark]{--bg:#081B1E;--surf:#102A2E;--ink:#E5F2EF;--mut:#93B3B0;--line:#24454A;--soft:#17353A;--deep:#031316;--ok-soft:#0F3A2D;--mid-soft:#3B2E0B;--bad-soft:#40201A;--sun-soft:#3B2E0B;--sh:0 1px 2px #0006,0 18px 40px -26px #000}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 var(--fu);min-height:100vh;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hd{position:sticky;top:0;z-index:20;background:var(--deep);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.hd-in{max-width:960px;margin:auto;display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,var(--sun),#ffd877);color:var(--deep);display:grid;place-items:center;font:700 26px var(--fd);flex:none}
.brand{flex:1;min-width:0;font:700 17px/1.2 var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font:500 12px var(--fu);opacity:.7}
.chip{display:inline-flex;align-items:center;gap:5px;background:#ffffff1c;border-radius:99px;padding:5px 11px;font-weight:700;font-size:14px;white-space:nowrap}
.ib{width:38px;height:38px;border-radius:12px;background:#ffffff1c;font-size:17px;display:grid;place-items:center}
main{max-width:960px;margin:auto;padding:14px 14px 0}
h1,h2,h3{font-family:var(--fd);margin:0;line-height:1.4}
/* hero */
.hero{background:linear-gradient(150deg,var(--deep),#0A4F55);color:#fff;border-radius:26px;padding:20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset-inline-start:-60px;bottom:-80px;width:220px;height:220px;border-radius:50%;border:34px solid #ffffff0d}
.ring{flex:none;position:relative;width:120px;height:120px}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 28px var(--fd)}
.hero-t{flex:1;min-width:210px;position:relative;z-index:1}
.hero h1{font-size:23px;margin-bottom:4px}.hero p{margin:0 0 12px;opacity:.82}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:14px;font-weight:800;background:var(--sun);color:var(--deep);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px -8px #0006}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.teal{background:var(--teal);color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}
.lvs{display:flex;gap:8px;margin:16px 0 4px;flex-wrap:wrap}
.lv{flex:1;min-width:98px;background:var(--surf);border:2px solid var(--line);border-radius:14px;padding:8px 10px;text-align:center;font-weight:800}
.lv small{display:block;font-weight:500;color:var(--mut);font-size:12px;line-height:1.3}
.lv.on{border-color:var(--teal);background:var(--soft)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 2px 6px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 14px;border-radius:99px;background:var(--surf);border:1.5px solid var(--line);font-weight:700;font-size:14px}
.tab.on{background:var(--teal);border-color:var(--teal);color:#fff}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surf);color:var(--ink);font:inherit;margin:6px 0 10px}
.list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.sc{display:flex;gap:12px;align-items:center;background:var(--surf);border:1.5px solid var(--line);border-radius:var(--r);padding:12px;text-align:start;transition:transform .15s,border-color .15s;box-shadow:var(--sh);width:100%}
.sc:hover{transform:translateY(-2px);border-color:var(--teal)}
.num{flex:none;width:44px;height:44px;border-radius:14px;background:var(--soft);color:var(--teal);display:grid;place-items:center;font:700 19px var(--fd)}
.sc.full .num{background:var(--ok);color:#fff}
.sc .t{flex:1;min-width:0}.sc .t b{display:block;font-family:var(--ft);font-size:19px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sc .t small{color:var(--mut);font-size:13px}
.bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2));border-radius:99px;transition:width .5s}
.sec-h{display:flex;align-items:center;gap:8px;margin:18px 2px 8px;font-size:18px}
/* lesson */
.back{display:inline-flex;gap:6px;align-items:center;font-weight:700;color:var(--teal);padding:8px 2px}
.ttl{font-size:24px;margin:2px 0 10px;font-family:var(--ft);font-weight:700;line-height:1.6}
.seg{display:flex;background:var(--soft);padding:4px;border-radius:14px;gap:4px;margin-bottom:12px;position:sticky;top:calc(62px + env(safe-area-inset-top));z-index:10}
.seg button{flex:1;padding:9px 4px;border-radius:11px;font-weight:800;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--surf);color:var(--teal);box-shadow:var(--sh)}
.card{background:var(--surf);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.def{padding:12px 0;border-bottom:1px dashed var(--line)}.def:last-child{border:0}
.def b{font:700 17px var(--fd);color:var(--teal);display:block}
.def p{margin:2px 0 0;font-family:var(--ft);font-size:19px;line-height:1.9}
.steps{counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:flex;gap:12px;padding:10px 0;font-family:var(--ft);font-size:19px;line-height:1.9}
.steps li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;background:var(--sun);color:var(--deep);display:grid;place-items:center;font:700 15px var(--fd);margin-top:4px}
.note{background:var(--sun-soft);border-radius:14px;padding:12px 14px;border-inline-start:5px solid var(--sun);font-family:var(--ft);font-size:19px}
/* practice */
.prog{display:flex;align-items:center;gap:10px;margin:2px 0 12px;font-weight:800;color:var(--mut)}.prog .bar{flex:1;margin:0;height:10px}
.ev{background:linear-gradient(180deg,var(--soft),transparent);border-radius:14px;padding:14px 10px;margin-bottom:12px}
.intro{font:700 16px var(--fd);color:var(--teal);margin-bottom:6px;text-align:center}
.poem{display:grid;grid-template-columns:auto auto;justify-content:center;column-gap:28px;row-gap:2px;font-family:var(--ft);font-size:calc(var(--fs) + 2px);line-height:2.1;max-width:100%}
.poem .h{white-space:nowrap;text-align:center;width:max-content;justify-self:center}
.poem.stack{grid-template-columns:auto;row-gap:0}.poem.stack .h:nth-child(2n){margin-bottom:10px}
.txt{font-family:var(--ft);font-size:calc(var(--fs) + 1px);line-height:2.1;text-align:justify}
.ayah,.hadith{font-family:var(--ft);font-size:calc(var(--fs) + 3px);line-height:2.2;text-align:center}
.ref{display:block;text-align:center;color:var(--mut);font-size:14px;margin-top:2px}
u.uw{text-decoration:none;border-bottom:3px solid var(--sun);background:linear-gradient(transparent 62%,#F2A90044 62%);padding:0 2px;border-radius:2px}
.q{margin:14px 0}.qt{font:700 18px/1.9 var(--ft);margin-bottom:8px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:center;text-align:start;padding:11px 12px;border-radius:14px;border:2px solid var(--line);background:var(--surf);font-family:var(--ft);font-size:19px;line-height:1.7;transition:transform .12s,border-color .12s,background .12s}
.opt:hover{border-color:var(--teal)}.opt .l{flex:none;width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font:700 14px var(--fd)}
.opt.sel{border-color:var(--teal);background:var(--soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);animation:pop .35s}.opt.ok .l{background:var(--ok);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}.opt.no .l{background:var(--bad);color:#fff}
.opt[disabled]{pointer-events:none}
.fld{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}.fld span{font-weight:700;color:var(--mut);min-width:110px;font-family:var(--ft);font-size:17px}
.fld input,textarea.inp{flex:1;min-width:150px;width:100%;padding:11px 13px;border-radius:12px;border:2px solid var(--line);background:var(--surf);color:var(--ink);font-family:var(--ft);font-size:19px;user-select:text;-webkit-user-select:text}
textarea.inp{resize:vertical;line-height:1.9}
.bt{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hint{background:var(--sun-soft);border-radius:12px;padding:10px 12px;margin-top:8px;font-family:var(--ft);font-size:18px;border-inline-start:4px solid var(--sun)}
.model{background:var(--ok-soft);border-radius:14px;padding:12px 14px;margin-top:12px;border-inline-start:5px solid var(--ok);font-family:var(--ft);font-size:19px;line-height:1.9}
.model b{display:block;font:700 15px var(--fd);color:var(--ok);margin-bottom:2px}
.pts{list-style:none;margin:8px 0 0;padding:0}.pts li{display:flex;gap:8px;padding:5px 0;font-size:16px;font-family:var(--ft)}
.pts input{width:20px;height:20px;accent-color:var(--ok);flex:none;margin-top:6px}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.gr button{padding:11px 4px;border-radius:14px;font-weight:800;border:2px solid var(--line);background:var(--surf)}
.gr .g1{border-color:var(--ok);color:var(--ok)}.gr .g2{border-color:var(--mid);color:var(--mid)}.gr .g3{border-color:var(--bad);color:var(--bad)}
.fb{margin-top:12px;padding:12px 14px;border-radius:14px;font-weight:800;font-size:17px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}.fb.no{background:var(--bad-soft);color:var(--bad)}.fb.mid{background:var(--mid-soft);color:var(--mid)}
.sum{text-align:center;padding:26px 16px}.sum .big{font:700 54px var(--fd);color:var(--teal)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.stats div{background:var(--soft);border-radius:14px;padding:10px 4px}.stats b{display:block;font:700 24px var(--fd)}
details.rd{background:var(--surf);border:1.5px solid var(--line);border-radius:var(--r);margin-bottom:12px;box-shadow:var(--sh)}
details.rd summary{padding:12px 16px;font-weight:800;cursor:pointer;color:var(--teal)}details.rd>div{padding:0 14px 14px}
.gl{display:grid;gap:4px;margin-top:10px;font-size:15px;color:var(--mut)}.gl b{color:var(--ink);font-family:var(--ft);font-size:17px}
.src{font-size:13px;color:var(--mut);margin-top:8px}
#lk{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 20% 10%,#0F6A70,var(--deep) 60%)}
#lk .bx{background:var(--surf);color:var(--ink);width:min(380px,100%);border-radius:26px;padding:26px 22px;text-align:center;box-shadow:0 30px 70px -20px #000}
#lk .lg{width:68px;height:68px;border-radius:20px;margin:0 auto 12px;background:linear-gradient(145deg,var(--sun),#ffd877);color:var(--deep);display:grid;place-items:center;font:700 44px var(--fd)}
#lk h1{font-size:23px}#lk p{color:var(--mut);margin:6px 0 14px}
#lk input{width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);font:700 20px var(--fu);text-align:center;letter-spacing:2px;background:var(--bg);color:var(--ink);direction:ltr}
#lk button{width:100%;margin-top:12px}#lkE{color:var(--bad);min-height:24px;margin-top:8px;font-weight:700}
.shake{animation:shake .4s}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(30px);opacity:0;background:var(--deep);color:#fff;padding:11px 18px;border-radius:99px;font-weight:800;z-index:40;transition:.3s;pointer-events:none;max-width:92%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:50}
@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.view>*{animation:up .35s both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{body{display:none}}
</style>
</head>
<body>
<div id="app">
  <header class="hd"><div class="hd-in">
    <div class="logo" aria-hidden="true">أ</div>
    <div class="brand">أركان التفاعلي في القراءة<small>الصف الثاني عشر · تعلّم وتدرّب وتقدّم</small></div>
    <span class="chip" title="النقاط">⭐ <span id="xp">0</span></span>
    <span class="chip" title="أيام متتالية">🔥 <span id="st">0</span></span>
    <button class="ib" id="snd" aria-label="الصوت">🔊</button>
    <button class="ib" id="thm" aria-label="الوضع الداكن">🌙</button>
  </div></header>
  <main id="v" class="view" aria-live="polite"></main>
</div>
<div id="toast" role="status"></div><canvas id="cf" aria-hidden="true"></canvas>
<script src="arkan-protect.js"></script>
<script>
(()=>{'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const rich=t=>esc(t).replace(/\[\[(.+?)\]\]/g,'<u class="uw">$1</u>');
const plain=t=>String(t||'').replace(/\[\[|\]\]/g,'');
const L=['أ','ب','ج','د','هـ'];
const SK='arkan2-v1';
const strip=t=>String(t||'').replace(/[\u064B-\u0652\u0670\u0640]/g,'');
const short=t=>{const s=String(t||'').trim();const c=s.split(/\s[–—-]\s|\s[(（]/)[0].trim();return c.length>=6?c:s};
const LV=[{n:1,name:'تأسيس',ic:'🌱',d:'تلميحات وخطوات'},{n:2,name:'متوسط',ic:'🌿',d:'نمط الاختبار'},{n:3,name:'متقدم',ic:'🌳',d:'تحليل بلا تلميحات'}];
let S={lv:2,xp:0,st:{d:'',n:0},done:{},snd:true,theme:''};
try{Object.assign(S,JSON.parse(localStorage.getItem(SK)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}};
let RAW,PARTS,SECS=[],TST=[];

/* ---------- صوت وتشجيع ---------- */
let AC=null;
function tone(f,d,ty='triangle',v=.14){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const sOk=()=>{tone(523.25,.12);setTimeout(()=>tone(783.99,.18),100)};
const sNo=()=>{tone(220,.15,'sine',.1);setTimeout(()=>tone(196,.2,'sine',.1),90)};
const sDone=()=>[523.25,659.25,783.99,1046.5].forEach((f,i)=>setTimeout(()=>tone(f,.2),i*110));
const sClick=()=>tone(440,.05,'square',.06);
const PH={ok:['أحسنت!','ممتاز، إجابة دقيقة','بالضبط، هذا صحيح','إجابة سليمة، واصل','رائع، تمكّنت منها'],
  mid:['اقتربت، راجع ما فاتك','نصف الطريق، أكمل الفكرة','جيد، وتبقى تفصيل واحد'],
  no:['قريب، راجع القاعدة وحاول مجددًا','لا بأس، الخطأ جزء من التعلم','اقرأ الإجابة النموذجية ثم أعد المحاولة']};
let lastP='';const phrase=k=>{let p;do{p=PH[k][Math.floor(Math.random()*PH[k].length)]}while(p===lastP&&PH[k].length>1);lastP=p;return p};
let tT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2200)}
function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const c=$('#cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#F2A900','#0B7C82','#14966B','#D6452B','#fff'],P=Array.from({length:110},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,v:3+Math.random()*4,w:6+Math.random()*6,a:Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)]}));
  let f=0;(function d(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.a+=.08)*2;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.w,p.w*.6)});if(++f<170)requestAnimationFrame(d);else x.clearRect(0,0,c.width,c.height)})()}
function addXp(n){S.xp+=n;const t=new Date().toISOString().slice(0,10);if(S.st.d!==t){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.st.n=S.st.d===y?S.st.n+1:1;S.st.d=t}save();head()}
function head(){$('#xp').textContent=S.xp;$('#st').textContent=S.st.n;$('#snd').textContent=S.snd?'🔊':'🔇'}

/* ---------- البيانات ---------- */
const lvOf=it=>it.lv||2;
function itemsOf(s){const a=s.items||[];if(!a.length)return a;const f=a.filter(it=>lvOf(it)===S.lv);return f.length?f:a}
const key=(s,it)=>s.id+'-'+it._k;
const doneN=s=>itemsOf(s).filter(it=>S.done[key(s,it)]).length;
function build(raw){
  RAW=raw;PARTS=raw.parts||raw;
  PARTS.forEach((p,pi)=>p.sections.forEach((s,si)=>{s.pi=pi;s.id='s'+SECS.length;s.idx=SECS.length;SECS.push(s);(s.items||[]).forEach((it,k)=>{it._k=k})}));
  (raw.tests||[]).forEach((t,i)=>{const s={type:'test',title:t.ttitle,id:'t'+i,test:t,items:t.items||[],pi:-1};s.items.forEach((it,k)=>{it._k=k});TST.push(s)});
}
const sTitle=s=>s.type==='test'?s.test.ttitle:short(s.title);
const sNum=s=>s.num!=null?s.num:(s.type==='test'?'اخ':'•');
const learnable=s=>['std','passage','poem','story','exm','test'].includes(s.type);

/* ---------- عرض الأدلة ---------- */
function poemHtml(rows){return '<div class="poem">'+rows.map(b=>typeof b==='string'?'<div class="h" style="grid-column:1/-1">'+rich(b)+'</div>':'<div class="h">'+rich(b[0])+'</div><div class="h">'+rich(b[1])+'</div>').join('')+'</div>'}
function evHtml(it){
  let h='';if(it.intro)h+='<div class="intro">'+rich(it.intro)+'</div>';
  if(it.poem)h+=poemHtml(it.poem);
  if(it.ayah)h+='<div class="ayah">﴿'+rich(it.ayah[0])+'﴾<span class="ref">'+esc(it.ayah[1])+'</span></div>';
  if(it.hadith)h+='<div class="hadith">'+rich(it.hadith[0])+'<span class="ref">'+esc(it.hadith[1])+'</span></div>';
  if(it.text)h+='<div class="txt">'+rich(it.text)+'</div>';
  return h?'<div class="ev">'+h+'</div>':'';
}
function fit(){document.querySelectorAll('.poem').forEach(p=>{
  const hs=[...p.children].filter(c=>!c.style.gridColumn);if(!hs.length)return;
  const stack=innerWidth<640;p.classList.toggle('stack',stack);p.style.fontSize='';
  const av=Math.max(120,p.parentElement.clientWidth-24);
  const w=hs.map(h=>h.getBoundingClientRect().width);
  const need=stack?Math.max(...w):Math.max(...w.filter((_,i)=>i%2===0))+Math.max(...w.filter((_,i)=>i%2===1))+28;
  if(need>av){const base=parseFloat(getComputedStyle(p).fontSize);p.style.fontSize=Math.max(base*.5,Math.floor(base*av/need*.97*10)/10)+'px'}})}
addEventListener('resize',()=>requestAnimationFrame(fit));

/* ---------- الشاشات ---------- */
const V=$('#v');let tab=0,cur=null;
function show(html){V.innerHTML=html;V.scrollIntoView({block:'start'});window.scrollTo(0,0);requestAnimationFrame(fit)}
function home(){
  const all=SECS.filter(s=>learnable(s)&&itemsOf(s).length),tot=all.reduce((a,s)=>a+itemsOf(s).length,0),dn=all.reduce((a,s)=>a+doneN(s),0),pc=tot?Math.round(dn*100/tot):0;
  const nxt=all.find(s=>doneN(s)<itemsOf(s).length)||all[0];
  const wrong=SECS.concat(TST).flatMap(s=>(s.items||[]).filter(it=>S.done[key(s,it)]&&S.done[key(s,it)].r==='no').map(it=>[s,it]));
  const R=46,C=2*Math.PI*R;
  let h=`<section class="hero"><div class="ring"><svg viewBox="0 0 110 110" width="120" height="120"><circle cx="55" cy="55" r="${R}" fill="none" stroke="#ffffff22" stroke-width="10"/><circle cx="55" cy="55" r="${R}" fill="none" stroke="var(--sun)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*pc/100} ${C}" transform="rotate(-90 55 55)"/></svg><b>${pc}%</b></div>
  <div class="hero-t"><h1>${dn?'واصل رحلتك':'ابدأ رحلتك'} في القراءة</h1><p>${dn} من ${tot} سؤالًا أنجزتها في مستوى «${LV[S.lv-1].name}»</p>
  <button class="btn" data-go="#/p/${nxt?nxt.id:''}">▶ ${dn?'أكمل من حيث توقفت':'ابدأ أول معيار'}</button>
  ${wrong.length?`<button class="btn ghost" style="margin-inline-start:8px;color:#fff;border-color:#ffffff55" data-go="#/r">🔁 راجع أخطاءك (${wrong.length})</button>`:''}</div></section>
  <div class="lvs" role="group" aria-label="المستوى">${LV.map(l=>`<button class="lv ${l.n===S.lv?'on':''}" data-lv="${l.n}">${l.ic} ${l.name}<small>${l.d}</small></button>`).join('')}</div>
  <input class="search" id="q" placeholder="ابحث عن معيار أو نص…" aria-label="بحث">
  <div class="tabs" role="tablist">${PARTS.map((p,i)=>`<button class="tab ${i===tab?'on':''}" data-tab="${i}">${esc(short(p.title).replace(/^.*?:\s*/,''))}</button>`).join('')}<button class="tab ${tab===9?'on':''}" data-tab="9">اختبارات النصوص</button></div><div id="ls"></div>`;
  show(h);lst();
}
function card(s){const n=itemsOf(s).length,d=doneN(s);return `<button class="sc ${n&&d===n?'full':''}" data-go="#/s/${s.id}"><span class="num">${esc(sNum(s))}</span><span class="t"><b>${esc(sTitle(s))}</b><small>${n?`${d} / ${n} سؤالًا`:'للقراءة'}</small><div class="bar"><i style="width:${n?d*100/n:0}%"></i></div></span></button>`}
function lst(){const q=strip(($('#q')||{}).value||'').trim();let a=tab===9?TST:(PARTS[tab]?PARTS[tab].sections:[]);
  if(q)a=SECS.concat(TST).filter(s=>strip(sTitle(s)).includes(q));
  $('#ls').innerHTML=a.length?`<div class="list">${a.map(card).join('')}</div>`:'<p class="card">لا نتائج مطابقة.</p>';}
function lesson(s,t){
  tab=t||0;const T=['المفهوم','كيف أجيب','مثال','تدرّب'];
  let h=`<a class="back" href="#/">› الرئيسية</a><h1 class="ttl">${esc(s.type==='test'?s.test.ttitle:s.title)}</h1>`;
  const hasLesson=s.type==='std';
  if(!hasLesson){return reading(s)}
  h+=`<div class="seg" role="tablist">${T.map((x,i)=>`<button class="${i===tab?'on':''}" data-t="${i}">${x}</button>`).join('')}</div>`;
  if(tab===0)h+=`<div class="card">${(s.rule||[]).map(r=>`<div class="def"><b>${rich(r[0])}</b><p>${rich(r[1])}</p></div>`).join('')}</div>${s.note?`<div class="note">${rich(s.note)}</div>`:''}`;
  if(tab===1)h+=`<div class="card"><ol class="steps">${(s.how||[]).map(x=>`<li>${rich(x)}</li>`).join('')}</ol></div>`;
  if(tab===2&&s.example){const e=s.example;h+=`<div class="card">${evHtml(e.item)}<div class="qt">${rich(e.item.qs[0].q)}</div><div class="model"><b>الإجابة النموذجية</b>${rich(e.answer)}</div></div>`}
  if(tab===3)h+=`<div class="card sum" style="padding:20px"><div style="font:700 40px var(--fd)">${doneN(s)}/${itemsOf(s).length}</div><p>أسئلة هذا المعيار في مستوى «${LV[S.lv-1].name}»</p><button class="btn teal" data-go="#/p/${s.id}">▶ ابدأ التدريب</button></div>`;
  show(h);
}
function reading(s){
  let h=`<a class="back" href="#/">› الرئيسية</a><h1 class="ttl">${esc(s.type==='test'?s.test.ttitle:s.title)}</h1>`;
  h+=readPanel(s,true);
  if(itemsOf(s).length)h+=`<div class="card sum"><div style="font:700 40px var(--fd)">${doneN(s)}/${itemsOf(s).length}</div><p>سؤالًا في هذا الدرس</p><button class="btn teal" data-go="#/p/${s.id}">▶ ابدأ الأسئلة</button></div>`;
  show(h);
}
function readPanel(s,open,g){
  let b='';const o=s.type==='test'?s.test:s,src=g||o;
  if(o.instruction||o.intro)b+=`<p class="intro">${rich(o.instruction||'')} ${rich(o.intro||'')}</p>`;
  if(o.ptitle)b+=`<h3 style="text-align:center">${esc(o.ptitle)}</h3>`;
  if(o.verses)b+=poemHtml(o.verses);
  if(o.blocks)b+=o.blocks.map(x=>`<div class="intro">${esc(x[0])}</div>`+poemHtml(x[1])).join('');
  (o.paras||[]).forEach(p=>b+=`<p class="txt">${rich(p)}</p>`);
  (o.stories||[]).forEach(x=>{b+=`<h3 style="margin-top:12px">${esc(x.title)}</h3>`+(x.paras||[]).map(p=>`<p class="txt">${rich(p)}</p>`).join('')});
  if(o.glossary&&o.glossary.length)b+=`<div class="gl">${o.glossary.map(x=>`<div><b>${esc(x[0])}</b>: ${esc(x[1])}</div>`).join('')}</div>`;
  if(o.source)b+=`<div class="src">${esc(o.source)}</div>`;
  if(!b)return '';
  return `<details class="rd" ${open?'open':''}><summary>📖 النص المقروء</summary><div>${b}</div></details>`;
}
function groupHtml(s,it){if(s.type!=='exm'||it.g==null)return '';const g=(s.groups||[])[it.g];if(!g)return '';
  let h=`<div class="intro">${esc(g.hd||'')}</div><p class="intro" style="color:var(--mut)">${esc(g.instr||'')}</p>`;
  if(g.poem){h+=`<h3 style="text-align:center">${esc(g.poem.title||'')}</h3>`+poemHtml(g.poem.verses||[])}
  if(g.text)h+=`<p class="txt">${rich(g.text)}</p>`;(g.paras||[]).forEach(p=>h+=`<p class="txt">${rich(p)}</p>`);
  return `<details class="rd"><summary>📖 ${esc(g.hd||'النص')}</summary><div>${h}</div></details>`}

/* ---------- محرك التدريب ---------- */
let Q=null;
function startPractice(list,title,back){Q={list,i:0,res:[],title,back,hint:0,st:'ask'};card2()}
function practice(s){const l=itemsOf(s).map(it=>[s,it]);if(!l.length){toast('لا أسئلة في هذا الدرس');return location.hash='#/s/'+s.id}Q=null;startPractice(l,sTitle(s),'#/s/'+s.id)}
function review(){const l=SECS.concat(TST).flatMap(s=>(s.items||[]).filter(it=>S.done[key(s,it)]&&S.done[key(s,it)].r==='no').map(it=>[s,it]));if(!l.length){toast('لا أخطاء للمراجعة 👏');return location.hash='#/'}startPractice(l,'مراجعة الأخطاء','#/')}
function card2(){
  const [s,it]=Q.list[Q.i];Q.st='ask';Q.hint=0;
  const pc=Math.round(Q.i*100/Q.list.length);
  let h=`<a class="back" href="${Q.back}">› ${esc(Q.title)}</a><div class="prog"><span>${Q.i+1}/${Q.list.length}</span><div class="bar"><i style="width:${pc}%"></i></div></div>`;
  if(Q.i===0||s.type==='exm'||s.type==='test'||['passage','poem','story'].includes(s.type))h+=(s.type==='exm'?groupHtml(s,it):readPanel(s,false));
  h+=`<article class="card" id="cd">${evHtml(it)}`;
  it.qs.forEach((q,qi)=>{
    h+=`<div class="q" data-q="${qi}"><div class="qt">${rich(q.q)}</div>`;
    if(q.mcq)h+=`<div class="opts">${q.mcq.map((o,oi)=>`<button class="opt" data-o="${oi}" data-qq="${qi}"><span class="l">${L[oi]}</span><span>${rich(o)}</span></button>`).join('')}</div>`;
    else if(q.fields)h+=q.fields.map((f,fi)=>`<label class="fld"><span>${rich(f)}</span><input data-qq="${qi}" aria-label="${esc(plain(f))}" autocomplete="off"></label>`).join('');
    else h+=`<textarea class="inp" rows="${Math.max(2,q.lines||2)}" data-qq="${qi}" aria-label="إجابتك" placeholder="اكتب إجابتك هنا…"></textarea>`;
    h+='</div>';
  });
  const onlyMcq=it.qs.length===1&&it.qs[0].mcq;
  h+=`<div id="fbk"></div><div class="bt" id="bt">${onlyMcq?'':`<button class="btn teal" data-act="check">تحقّق</button>`}${S.lv===1&&it.hints&&it.hints.length?`<button class="btn ghost" data-act="hint">💡 تلميح</button>`:''}<button class="btn ghost" data-act="skip">تخطَّ</button></div></article>`;
  show(h);
}
function grade(r){ // r: ok | mid | no
  const [s,it]=Q.list[Q.i];if(Q.st==='done')return;Q.st='done';Q.res.push(r);
  S.done[key(s,it)]={r};
  const xp={ok:10,mid:5,no:2}[r];addXp(xp);
  r==='ok'?sOk():r==='mid'?sClick():sNo();
  const fb=$('#fbk');
  const model=`<div class="model"><b>الإجابة النموذجية</b>${rich(it.ans)}</div>`;
  fb.innerHTML=`<div class="fb ${r==='ok'?'ok':r==='mid'?'mid':'no'}">${r==='ok'?'✅':r==='mid'?'◐':'✖'} ${phrase(r)} <span style="float:left;font-family:var(--fd)">+${xp}</span></div>`+(it.qs.every(q=>q.mcq)&&r==='ok'?'':model);
  $('#bt').innerHTML=`<button class="btn teal" data-act="next">${Q.i+1<Q.list.length?'السؤال التالي ‹':'إنهاء ✓'}</button>`;
  $('#cd').querySelectorAll('.opt,input,textarea').forEach(e=>e.disabled=true);
  fb.scrollIntoView({block:'center',behavior:'smooth'});
}
function check(){
  const [s,it]=Q.list[Q.i];const cd=$('#cd');
  if(it.qs.every(q=>q.mcq)){ // اختياري بالكامل
    let okN=0;it.qs.forEach((q,qi)=>{const sel=cd.querySelector(`.opt.sel[data-qq="${qi}"]`);cd.querySelectorAll(`.opt[data-qq="${qi}"]`).forEach(b=>{const oi=+b.dataset.o;if(oi===q.key)b.classList.add('ok');else if(b===sel)b.classList.add('no')});if(sel&&+sel.dataset.o===q.key)okN++});
    return grade(okN===it.qs.length?'ok':'no');
  }
  // إجابة مفتوحة: أظهر النموذج ثم قيّم نفسك
  Q.st='self';const model=`<div class="model"><b>الإجابة النموذجية</b>${rich(it.ans)}${it.pts?`<ul class="pts">${it.pts.map(p=>`<li><input type="checkbox" aria-label="${esc(plain(p))}"><span>${rich(p)}</span></li>`).join('')}</ul>`:''}</div>
  <p style="margin:12px 0 0;font-weight:800">قارن إجابتك بالنموذج، ثم قيّم نفسك:</p><div class="gr"><button class="g1" data-gr="ok">أصبت</button><button class="g2" data-gr="mid">جزئيًا</button><button class="g3" data-gr="no">أخطأت</button></div>`;
  $('#fbk').innerHTML=model;$('#bt').innerHTML='';$('#fbk').scrollIntoView({block:'center',behavior:'smooth'});
  cd.querySelectorAll('input[data-qq],textarea').forEach(e=>e.disabled=true);
}
function summary(){
  const n=Q.res.length,ok=Q.res.filter(x=>x==='ok').length,mid=Q.res.filter(x=>x==='mid').length,no=n-ok-mid,pc=n?Math.round((ok+mid*.5)*100/n):0;
  window.dispatchEvent(new CustomEvent('arkan-level',{detail:{sec:Q.title,lv:S.lv,pc}}));
  pc>=70?(sDone(),confetti()):sClick();
  show(`<a class="back" href="#/">› الرئيسية</a><div class="card sum"><div style="font-size:46px">${pc>=85?'🏆':pc>=70?'🌟':'💪'}</div><div class="big">${pc}%</div><h2>${pc>=85?'أنجزت التدريب بامتياز!':pc>=70?'نتيجة تستحق التقدير':'محاولة جيدة، والتحسن قادم'}</h2>
  <div class="stats"><div><b style="color:var(--ok)">${ok}</b>أصبت</div><div><b style="color:var(--mid)">${mid}</b>جزئيًا</div><div><b style="color:var(--bad)">${no}</b>أخطأت</div></div>
  <div class="bt" style="justify-content:center">${no?`<button class="btn teal" data-go="#/r">🔁 راجع أخطاءك</button>`:''}<a class="btn ghost" href="${Q.back}" style="text-decoration:none">رجوع للدرس</a><a class="btn" href="#/" style="text-decoration:none">الرئيسية</a></div></div>`);
}

/* ---------- التوجيه والأحداث ---------- */
function route(){
  if(!RAW)return;const h=location.hash||'#/',p=h.split('/');
  if(p[1]==='s'){const s=[...SECS,...TST].find(x=>x.id===p[2]);return s?lesson(s,tab):home()}
  if(p[1]==='p'){const s=[...SECS,...TST].find(x=>x.id===p[2]);return s?practice(s):home()}
  if(p[1]==='r')return review();
  home();
}
addEventListener('hashchange',()=>{tab=location.hash.startsWith('#/s/')?tab:tab;route()});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-lv],[data-tab],[data-t],[data-act],[data-gr],.opt');if(!t||!RAW)return;
  if(t.dataset.go){sClick();if(t.dataset.go.startsWith('#/s/'))tab=0;location.hash=t.dataset.go;return}
  if(t.dataset.lv){S.lv=+t.dataset.lv;save();sClick();home();return}
  if(t.dataset.tab!=null){tab=+t.dataset.tab;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b===t));lst();sClick();return}
  if(t.dataset.t!=null){tab=+t.dataset.t;const id=location.hash.split('/')[2];const s=[...SECS,...TST].find(x=>x.id===id);lesson(s,tab);sClick();return}
  if(t.classList.contains('opt')){const q=t.dataset.qq;if(Q&&Q.st==='ask'){document.querySelectorAll(`.opt[data-qq="${q}"]`).forEach(b=>b.classList.toggle('sel',b===t));sClick();const it=Q.list[Q.i][1];if(it.qs.length===1)check()}return}
  if(t.dataset.gr){grade(t.dataset.gr);return}
  const a=t.dataset.act;
  if(a==='check')check();
  if(a==='hint'){const it=Q.list[Q.i][1];if(Q.hint<it.hints.length){$('#fbk').insertAdjacentHTML('beforeend',`<div class="hint">💡 ${rich(it.hints[Q.hint++])}</div>`);sClick();if(Q.hint>=it.hints.length)t.disabled=true}}
  if(a==='skip'||a==='next'){if(a==='skip')Q.res.push('no');if(Q.i+1<Q.list.length){Q.i++;card2()}else summary()}
});
document.addEventListener('input',e=>{if(e.target.id==='q')lst()});
$('#snd').onclick=()=>{S.snd=!S.snd;save();head();if(S.snd)sClick()};
function theme(){const d=S.theme?S.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;document.documentElement.dataset.theme=d?'dark':'light';$('#thm').textContent=d?'☀️':'🌙'}
$('#thm').onclick=()=>{S.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';save();theme()};

/* ---------- فتح الكتاب مباشرة دون تسجيل أو كود ---------- */
(async()=>{
  theme();
  try{
    const r=await fetch('/book-data.json',{cache:'force-cache'});
    if(!r.ok)throw new Error('book');
    build(await r.json());head();route();
  }catch(e){
    show('<div class="card sum"><h2>تعذّر تحميل الكتاب</h2><p>تحقق من اتصالك بالإنترنت ثم أعد تحميل الصفحة.</p></div>');
  }
})();
})();
</script>
