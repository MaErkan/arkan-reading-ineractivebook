<body><main class="card"><div class="mark">أ</div><h1>يُفتح قريبًا</h1><p>نعمل على تجهيز هذا الركن ليصل إليك بصورة تليق بأركان. يمكنك الآن العودة إلى البوابة أو الدخول إلى ركن القراءة.</p><a href="/">العودة إلى بوابة أركان</a></main></body>
