/* ---------- ÿ±ÿ£ÿ≥ ÿßŸÑŸÇÿ≥ŸÖ ---------- */
.eyebrow{background:var(--gold-soft);color:var(--gold-deep);border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);font-weight:700}
.badge{min-width:60px;height:74px;border-radius:999px 999px 16px 16px;background:linear-gradient(180deg,var(--teal-2),var(--teal-deep));
  border:2px solid var(--gold);box-shadow:0 12px 20px -12px rgba(11,85,96,.85),inset 0 3px 0 rgba(255,255,255,.28);transform:none;padding-top:10px}
.badge span{color:#fff;font-size:28px;transform:none}
.badge.tb{background:linear-gradient(180deg,#D8704A,var(--coral))}
h1.stitle{color:var(--teal-deep);font-weight:700}
h2.pill{color:#fff;background:linear-gradient(180deg,var(--teal-2),var(--teal-deep));border:0;border-bottom:3px solid var(--gold);border-radius:16px;
  box-shadow:var(--soft);transform:none;padding:3px 24px 5px;font-weight:700}
h2.pill:not(.green){background:linear-gradient(180deg,#D8704A,var(--coral))}
h2.pill.green{background:linear-gradient(180deg,var(--teal-2),var(--teal-deep))}

/* ---------- ÿßŸÑŸÖÿ≠ÿ™ŸàŸâ ÿßŸÑÿ™ÿπŸÑŸäŸÖŸä ---------- */
.rules{border:1px solid var(--gold);border-radius:20px;box-shadow:var(--shadow)}
.rules .r{border-top:1px solid var(--line)}
.rules .k{background:linear-gradient(180deg,var(--teal-2),var(--teal-deep));color:#fff}
.how{background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 60%,transparent);border-radius:20px}
.how li::before{background:var(--coral);font-weight:700}
.note{color:var(--coral)}
.card{border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);background:var(--card)}
.example{border:1px dashed var(--gold);background:var(--warm)}
.ex-tag{color:var(--gold-deep);background:var(--gold-soft);border:1px solid var(--gold);box-shadow:none;transform:none}
.item.done{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.inum{background:linear-gradient(180deg,#D8704A,var(--coral));box-shadow:0 8px 12px -8px rgba(196,85,47,.9);border-radius:50% 50% 50% 14px}
.item.done .inum{background:linear-gradient(180deg,#2E9A72,var(--ok-fill));box-shadow:0 8px 12px -8px rgba(29,122,85,.9)}
.ayah{background:var(--teal-soft);border:1px solid color-mix(in srgb,var(--teal) 30%,transparent);color:var(--teal-deep)}
.hadith{background:var(--sky-soft);border:1px solid color-mix(in srgb,var(--hadith) 25%,transparent)}
.qt::before{background:var(--gold);box-shadow:0 0 0 2.5px color-mix(in srgb,var(--gold-deep) 55%,transparent);border-radius:2px;transform:rotate(45deg)}
u{background:linear-gradient(transparent 55%,color-mix(in srgb,var(--gold) 55%,transparent) 55%)}
textarea{border:1.5px dashed color-mix(in srgb,var(--teal) 40%,var(--line));background:color-mix(in srgb,var(--paper) 55%,var(--card))}
textarea:focus{border-color:var(--teal);background:var(--teal-soft)}
.opt{border:1.5px solid var(--line);background:var(--card)}
.opt:hover{border-color:var(--teal);box-shadow:0 8px 14px -12px rgba(11,85,96,.9)}
.opt .l{background:var(--teal-soft);color:var(--teal-deep);font-weight:700}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}
.reveal{border:1px solid var(--gold-deep);background:linear-gradient(180deg,var(--teal-2),var(--teal-deep));color:#fff;box-shadow:var(--soft);border-radius:14px;font-weight:700}
.reveal:active{transform:translateY(1px);box-shadow:none}
.reveal[aria-expanded="true"]{background:var(--card);color:var(--teal-deep);border-color:var(--teal)}
.reveal[aria-disabled="true"]{opacity:.5;box-shadow:none}
.aibtn{border:1px solid var(--gold-deep);background:linear-gradient(180deg,#E9CF86,var(--gold));color:#3A2A06;box-shadow:var(--soft);border-radius:14px;font-weight:800}
.aibtn:active:not(:disabled){transform:translateY(1px);box-shadow:none}
.ans{border-inline-start:5px solid var(--ok);border-radius:16px}
.textbox{border:1px solid var(--gold);background:var(--warm);border-radius:24px;box-shadow:var(--shadow);outline:1px solid color-mix(in srgb,var(--gold) 35%,transparent);outline-offset:-7px}
.textbox h3{color:var(--coral)}
.src b,.gloss b,.blab{color:var(--coral)}
.nav{border-top:1px dashed var(--gold)}
.nav button{border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.nav button:hover{border-color:var(--teal)}
.nav button b{color:var(--teal-deep)}
.sprog .track,.tbar .track,.cbar .track{border:1px solid var(--line);background:var(--line2)}
.sprog .fill{background:linear-gradient(90deg,var(--gold),var(--ok-fill))}
.tbar .fill{background:linear-gradient(90deg,var(--gold),var(--coral))}
.hint{background:var(--gold-soft);border-inline-start:5px solid var(--gold)}
.hintbtn{border:1.5px dashed var(--gold);background:var(--gold-soft);color:var(--ink)}
.lvtag{background:var(--teal-soft);color:var(--teal-deep)}
.lvtag.lv1{background:var(--ok-soft);color:var(--ok)}
.lvtag.lv3{background:var(--coral-soft);color:var(--coral)}
.lvnote{border:1px dashed var(--gold);background:var(--gold-soft)}
.aifb{border:1px solid var(--line)}
.aifb.mid{border-color:var(--gold);background:var(--gold-soft)}
.tintro{background:var(--warm);border:1px solid var(--gold);box-shadow:var(--shadow);outline:1px solid color-mix(in srgb,var(--gold) 35%,transparent);outline-offset:-7px}
.tintro::before{background:var(--gold-soft);opacity:.9}
.tintro::after{background:var(--teal-light);opacity:.55}
.tstats div,.tlvnote{background:var(--card);border:1px solid var(--gold);border-radius:16px}
.tcov span{background:var(--card);border:1px solid var(--line)}
.tgo{border:1px solid var(--gold-deep);background:linear-gradient(180deg,#D8704A,var(--coral));color:#fff;box-shadow:var(--soft);border-radius:16px;font-size:20px}
.tgo:active{transform:translateY(1px);box-shadow:none}
.tgo.alt{background:var(--card);color:var(--teal-deep);border-color:var(--teal)}
.ring{box-shadow:0 0 0 4px var(--card),0 0 0 6px var(--gold)}
.sa button{border:1.5px solid var(--line)}
.toast{border:1px solid var(--gold);box-shadow:0 20px 40px -20px rgba(11,85,96,.7);border-radius:20px;background:var(--card)}
.tgo2{border:1px solid var(--gold-deep);background:linear-gradient(180deg,var(--teal-2),var(--teal-deep));color:#fff;box-shadow:var(--soft);border-radius:12px}

.home.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(255,255,255,0) 0,rgba(247,243,234,.55) 62%,var(--paper) 100%)}
.hero-art{width:min(300px,64%);margin:0 auto 14px;aspect-ratio:1/1.08;border-radius:999px 999px 26px 26px;overflow:hidden;position:relative;
  border:4px solid var(--card);outline:2px solid var(--gold);box-shadow:0 30px 50px -26px rgba(11,85,96,.8);animation:rise .8s cubic-bezier(.2,.9,.3,1) both}
.hero-art img{width:100%;height:100%;object-fit:cover;object-position:50% 40%;display:block}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
.hero-body{max-width:640px;margin:0 auto}
.home h1{font-size:clamp(34px,5.4vw,56px);color:var(--teal-deep);text-shadow:0 2px 0 rgba(255,255,255,.8);margin:6px 0 0;line-height:1.35}
.home .by{display:inline-block;background:var(--gold-soft);color:var(--gold-deep);border:1px solid var(--gold);transform:none;font-size:18px;padding:0 18px 2px;margin:8px 0 14px}
.home p{font-family:var(--text);font-size:20px;color:var(--ink)}
.steps{counter-reset:st;text-align:right}
.steps div{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:20px;padding:36px 14px 12px}
.steps div::before{background:linear-gradient(180deg,var(--teal-2),var(--teal-deep));color:#fff;border:2px solid var(--gold);width:34px;height:34px;border-radius:999px 999px 8px 8px;top:-17px}
.steps div:nth-child(1),.steps div:nth-child(2),.steps div:nth-child(3){background:var(--card)}
.steps b{color:var(--teal-deep)}
.start{border:1px solid var(--gold-deep);background:linear-gradient(180deg,var(--teal-2),var(--teal-deep));color:#fff;border-radius:18px;box-shadow:0 18px 26px -16px rgba(11,85,96,.95),inset 0 2px 0 rgba(255,255,255,.25);padding:8px 38px 10px;font-size:24px}
.start:hover{filter:brightness(1.06);transform:translateY(-2px);box-shadow:0 22px 30px -16px rgba(11,85,96,.95),inset 0 2px 0 rgba(255,255,255,.25)}
.start:active{transform:translateY(1px)}
.parts{margin-top:30px}
.part{border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.part h3{color:var(--teal-deep)}
.part h3::before{border-radius:3px;background:var(--gold);box-shadow:none;transform:rotate(45deg);width:12px;height:12px}
.chip{border:1.5px solid var(--line);background:var(--paper)}
.chip:hover{border-color:var(--teal);background:var(--teal-soft)}
.chip i{background:var(--gold-soft);color:var(--gold-deep);border-radius:12px 12px 6px 6px;font-family:var(--display);font-weight:700}
.chip.full{border-color:var(--ok);background:var(--ok-soft)}
.chip.full i{background:var(--ok-fill);color:#fff}
.chip.tst{border-color:var(--coral);background:var(--coral-soft)}
.chip.tst i{background:var(--coral);color:#fff}
.lvpick{border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow)}
.lvpick h3{color:var(--teal-deep)}
.lvcard{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:22px;background:var(--card)}
.lvcard:hover{box-shadow:0 22px 30px -22px rgba(11,85,96,.8)}
.lvcard.lv1{background:linear-gradient(180deg,var(--ok-soft),var(--card))}
.lvcard.lv2{background:linear-gradient(180deg,var(--teal-soft),var(--card))}
.lvcard.lv3{background:linear-gradient(180deg,var(--coral-soft),var(--card))}
.lvcard.on{outline:2px solid var(--gold);outline-offset:3px}
.lvcard b{color:var(--teal-deep)}
.lvprog .track{border:1px solid var(--line);background:var(--line2)}
.lvprog .fill{background:linear-gradient(90deg,var(--gold),var(--teal))}

html #lk::before,#lk::after{display:none}
html #lk .bx{background:linear-gradient(180deg,#FFFFFF,#FBF6EA);border:1px solid var(--gold);border-radius:30px;box-shadow:0 40px 70px -30px rgba(5,40,48,.85);padding:0 24px 24px;outline:1px solid color-mix(in srgb,var(--gold) 40%,transparent);outline-offset:-7px}
html #lk .hd{width:122px;margin:-70px auto 6px}
html #lk .lg{width:122px;height:132px;object-fit:cover;object-position:50% 38%;border-radius:999px 999px 22px 22px;border:3px solid #fff;outline:2px solid var(--gold);box-shadow:0 22px 34px -18px rgba(5,40,48,.9);transform:none;background:#EBD3A8}
html #lk .ic{inset:auto -8px -8px auto;background:linear-gradient(180deg,#E9CF86,var(--gold));border:2px solid #fff;box-shadow:0 8px 14px -8px rgba(5,40,48,.8)}
html #lk h1{font-family:var(--display);font-weight:700;color:var(--teal-deep);font-size:30px}
html #lk p{color:var(--muted)}
html #lk input{border:1.5px solid var(--line);background:#fff;border-radius:16px}
html #lk input:focus,#lk input:focus-visible{border-color:var(--teal);box-shadow:0 0 0 5px var(--teal-soft);outline:none}
html #lk button{font-family:var(--display);font-weight:700;border:1px solid var(--gold-deep);border-radius:18px;color:#fff;background:linear-gradient(180deg,var(--teal-2),var(--teal-deep));
  box-shadow:0 16px 24px -14px rgba(11,85,96,.95),inset 0 2px 0 rgba(255,255,255,.25);font-size:24px}
html #lk button:active{transform:translateY(1px);box-shadow:none}
html #lk .er{color:var(--coral)}

/* ---------- ÿßŸÑŸàÿ∂ÿπ ÿßŸÑÿØÿßŸÉŸÜ: ÿÆŸÅÿ∂ ÿ≥ÿ∑Ÿàÿπ ÿßŸÑÿµŸàÿ± ---------- */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .home.hero::before{background:linear-gradient(180deg,rgba(11,27,30,.62) 0,rgba(11,27,30,.78) 60%,var(--paper) 100%)}
  :root:not([data-theme="light"]) .home h1{text-shadow:none}
  :root:not([data-theme="light"]) .hero-art{border-color:var(--card)}
  :root:not([data-theme="light"]) #lk .bx{background:linear-gradient(180deg,#122A2F,#0F2428)}
  :root:not([data-theme="light"]) #lk input{background:#0B1B1E;color:var(--ink)}}
:root[data-theme="dark"] .home.hero::before{background:linear-gradient(180deg,rgba(11,27,30,.62) 0,rgba(11,27,30,.78) 60%,var(--paper) 100%)}
:root[data-theme="dark"] .home h1{text-shadow:none}
:root[data-theme="dark"] #lk .bx{background:linear-gradient(180deg,#122A2F,#0F2428)}
:root[data-theme="dark"] #lk input{background:#0B1B1E;color:var(--ink)}

@media (max-width:620px){
  .home.hero{padding:26px 14px 24px;border-radius:26px;background-size:auto 70%;background-position:center top}
  .hero-art{width:min(250px,70%)}
  .steps{gap:26px}
  .brand .mark{width:32px;height:39px}
}
