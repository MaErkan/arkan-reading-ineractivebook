<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>لوحة المعلم – أركان</title>
<style>
:root{--bg:#EFF7F4;--card:#fff;--ink:#12302f;--teal:#0B7C82;--ok:#1D7A55;--bad:#C9442A;--line:#d5e3df}
@media (prefers-color-scheme:dark){:root{--bg:#0C1A1D;--card:#14282b;--ink:#e6f2ef;--line:#294045}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Tajawal","Segoe UI",Tahoma,sans-serif}
header{background:var(--teal);color:#fff;padding:14px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{margin:0;font-size:20px;flex:1}main{max-width:820px;margin:0 auto;padding:14px 12px 60px}
button{font:700 15px inherit;font-family:inherit;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;background:var(--teal);color:#fff}
button.ok{background:var(--ok)}button.bad{background:var(--bad)}button.ghost{background:transparent;color:inherit;border:1.5px solid var(--line)}
input,textarea{font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:14px;opacity:.85;margin-bottom:8px}.tag{padding:2px 10px;border-radius:99px;background:var(--line)}
.lbl{font-weight:800;color:var(--teal);margin-top:10px}pre{white-space:pre-wrap;font:inherit;margin:4px 0;padding:8px 10px;background:var(--bg);border-radius:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.tabs{display:flex;gap:8px;margin:6px 0 4px}.st-approved{color:var(--ok);font-weight:800}.st-rejected{color:var(--bad);font-weight:800}
#login{max-width:380px;margin:60px auto;text-align:center}
</style></head><body>
<header><h1>🧑‍🏫 لوحة المعلم – اعتماد الإجابات المقالية</h1><button class="ghost" id="out" hidden style="color:#fff;border-color:#fff8">خروج</button></header>
<main>
<div id="login" class="card"><p>أدخل رمز المعلم</p><input id="code" type="password" autocomplete="off" placeholder="الرمز السري"><div class="row" style="justify-content:center"><button id="go">دخول</button></div><p id="err" style="color:var(--bad)"></p></div>
<div id="app" hidden>
 <div class="tabs"><button id="tp">بانتظار القرار</button><button class="ghost" id="ta">كل الطلبات</button><button class="ghost" id="rf">↻ تحديث</button></div>
 <div id="list"></div>
 <div class="card" id="gen"><div class="lbl">🔑 توليد كلمة مرور عشوائية للكتاب</div>
  <p style="margin:4px 0">الكود الحالي يوزّعه بوت أركان (@smart_arkanBot) على الطلاب بعد موافقتك. لتغييره: ولّد كودًا وأرسله لمساعدك ليعيد تشفير الكتاب ويحدّث كود البوت معًا — مصدر واحد للكود.</p>
  <div class="row"><button id="gb">توليد كود</button><button class="ghost" id="gc">نسخ</button></div><pre id="gv" style="font-size:22px;letter-spacing:3px;direction:ltr;text-align:center">—</pre></div>
</div></main>
<script>
const $=id=>document.getElementById(id); let CODE=sessionStorage.getItem('tc')||'', MODE='pending';
const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
async function api(method,path,body){ const r=await fetch(path,{method,headers:{'content-type':'application/json','x-teacher-code':encodeURIComponent(CODE)},body:body?JSON.stringify(body):undefined}); const j=await r.json().catch(()=>({})); return {r,j}; }
function card(x){
  const when=new Date(x.ts).toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'});
  const ans=x.qs.map(q=>`<div class="lbl">${esc(q.q)}</div>`+q.answers.map(a=>`<pre>${esc(a)||'—'}</pre>`).join('')).join('');
  const done=x.status!=='pending'?`<div class="${x.status==='approved'?'st-approved':'st-rejected'}">${x.status==='approved'?'✓ معتمدة':'✗ مرفوضة'}${x.note?' — '+esc(x.note):''}</div>`:'';
  return `<div class="card" data-k="${esc(x.key)}"><div class="meta"><b>${esc(x.name||'طالب')}</b><span class="tag">${esc(x.std)}</span><span class="tag">${esc(x.level)}</span><span>${when}</span></div>
  ${x.quote?`<div class="lbl">النص</div><pre>${esc(x.quote)}</pre>`:''}${ans}
  <div class="lbl">الإجابة النموذجية</div><pre>${esc(x.model)}</pre>
  <div class="lbl">رأي المعلم الذكي: ${esc(x.ai.verdict)}</div><pre>${esc(x.ai.why)}${x.ai.missing?'\nما ينقصها: '+esc(x.ai.missing):''}</pre>
  ${done}
  <textarea rows="2" placeholder="ملاحظة للطالب (اختياري)" data-n>${esc(x.note||'')}</textarea>
  <div class="row"><button class="ok" data-d="approved">✓ اعتمدها صحيحة</button><button class="bad" data-d="rejected">✗ لا أعتمدها</button></div></div>`;
}
async function load(){
  const {r,j}=await api('GET','/api/teacher?status='+MODE);
  if(r.status===403){ sessionStorage.removeItem('tc'); show(false); $('err').textContent='الرمز غير صحيح'; return; }
  if(r.status===503){ $('list').innerHTML='<div class="card">لم يُضبط TEACHER_CODE في Netlify بعد.</div>'; return; }
  $('list').innerHTML=(j.items||[]).map(card).join('')||'<div class="card">لا توجد طلبات الآن 👌</div>';
}
function show(on){ $('login').hidden=on; $('app').hidden=!on; $('out').hidden=!on; }
$('go').onclick=()=>{ CODE=$('code').value.trim(); if(!CODE) return; sessionStorage.setItem('tc',CODE); show(true); load(); };
$('code').onkeydown=e=>{ if(e.key==='Enter') $('go').click(); };
$('out').onclick=()=>{ sessionStorage.removeItem('tc'); CODE=''; show(false); };
$('tp').onclick=()=>{ MODE='pending'; $('tp').className=''; $('ta').className='ghost'; load(); };
$('ta').onclick=()=>{ MODE='all'; $('ta').className=''; $('tp').className='ghost'; load(); };
$('rf').onclick=load;
$('list').onclick=async e=>{ const b=e.target.closest('[data-d]'); if(!b) return; const c=b.closest('.card'); b.disabled=true;
  const {r}=await api('POST','/api/teacher',{key:c.dataset.k,decision:b.dataset.d,note:c.querySelector('[data-n]').value}); if(r.ok) load(); else { b.disabled=false; alert('تعذّر الحفظ'); } };
$('gb').onclick=()=>{ const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789', r=crypto.getRandomValues(new Uint32Array(8)); $('gv').textContent=Array.from(r,x=>A[x%A.length]).join(''); };
$('gc').onclick=()=>{ const v=$('gv').textContent; if(v&&v!=='—') navigator.clipboard&&navigator.clipboard.writeText(v); };
if(CODE){ show(true); load(); }
</script></body></html>
