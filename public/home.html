<style>
:root{
  color-scheme:dark;
  --night:#031917; --deep:#06302d; --teal:#0b4f49; --turq:#2db3a2; --gold:#d6ae55; --gold-2:#f0d58f;
  --cream:#f6ecd4; --paper:#f3e8cd; --ink:#10211e; --muted:#9db5ad; --rust:#b0482f;
  --font-display:'Reem Kufi','IBM Plex Sans Arabic',sans-serif; --font-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--night:#031917}}
:root[data-theme="dark"]{--night:#031917}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth;background:var(--night)}
body{margin:0;background:var(--night);color:var(--cream);font-family:var(--font-body);font-size:17px;line-height:1.9;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--night);z-index:90}
button{font-family:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}

/* ---------- top bar ---------- */
.top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:80;display:flex;align-items:center;justify-content:space-between;padding:14px 26px;pointer-events:none}
.top>*{pointer-events:auto}
.logo{font-family:var(--font-display);font-size:30px;font-weight:700;color:var(--gold);text-decoration:none;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.dots{display:flex;gap:6px;background:rgba(3,25,23,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(214,174,85,.35);padding:5px;border-radius:999px}
.dots a{text-decoration:none;font-size:14.5px;padding:4px 14px;border-radius:999px;color:var(--cream)}
.dots a:hover{background:rgba(214,174,85,.22)}

/* ---------- gate ---------- */
.gate{position:relative;height:100svh;min-height:600px;overflow:hidden;background:#06143a}
.gate-bg{position:absolute;inset:-6%;background:var(--gate) center/cover no-repeat;filter:blur(18px) brightness(.45) saturate(1.2)}
.gate-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.gatepic{position:relative;width:min(100vw,calc(100svh*.5633));aspect-ratio:676/1200;background:var(--gate) center/100% 100% no-repeat;transform-origin:50.85% 75.67%;transition:transform 2.2s cubic-bezier(.65,0,.25,1) .9s}
.gate.open .gatepic{transform:translateY(-25.67%) scale(3.7)}
.doorbox{position:absolute;left:38.24%;top:60.33%;width:25.22%;height:30.67%;perspective:700px;clip-path:polygon(0 100%,0 33%,5% 24%,16% 12%,32% 4%,50% 0,68% 4%,84% 12%,95% 24%,100% 33%,100% 100%)}
.reveal{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 85%,#fff1c4 0%,#f0b94e 30%,#7a4a10 80%)}
.reveal::after{content:"";position:absolute;inset:0;background:var(--hero) center/cover no-repeat;opacity:.55;mix-blend-mode:multiply}
.leaf{position:absolute;top:0;bottom:0;width:50%;background-size:200% 100%;background-repeat:no-repeat;backface-visibility:hidden;transition:transform 1.5s cubic-bezier(.5,.05,.2,1)}
.leaf.l{left:0;background-image:var(--leafl);background-size:100% 100%;transform-origin:left center}
.leaf.r{right:0;background-image:var(--leafr);background-size:100% 100%;transform-origin:right center}
.gate.open .leaf.l{transform:rotateY(104deg)}
.gate.open .leaf.r{transform:rotateY(-104deg)}
.hit{position:absolute;left:36%;top:58%;width:30%;height:34%;background:none;border:0;cursor:pointer;border-radius:999px 999px 0 0;z-index:3}
.hit:focus-visible{outline:3px solid var(--gold-2)}
.pulse{position:absolute;left:50.85%;top:75.67%;width:11%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:2px solid rgba(255,230,160,.9);animation:pul 2.2s ease-out infinite;pointer-events:none}
@keyframes pul{0%{transform:translate(-50%,-50%) scale(.6);opacity:.95}100%{transform:translate(-50%,-50%) scale(2.3);opacity:0}}
.gate.open .pulse{display:none}
.gate-ui{position:absolute;z-index:5;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 70px);text-align:center;pointer-events:none;transition:opacity .6s}
.gate-ui h1{font-family:var(--font-display);font-size:clamp(30px,min(8vw,7svh),64px);line-height:1;margin:0;color:var(--gold-2);font-weight:700;text-shadow:0 4px 24px #000,0 0 40px rgba(10,30,90,.9)}
.gate-ui p{margin:8px 0 0;font-size:clamp(16px,2.2vw,22px);color:#fff;text-shadow:0 2px 12px #000}
.gate.open .gate-ui{opacity:0}
.inside{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 50%,rgba(255,220,140,.25),rgba(6,20,58,.92) 75%),var(--hero) center/cover no-repeat;opacity:0;pointer-events:none;transition:opacity 1s 2.6s}
.gate.open .inside{opacity:1;pointer-events:auto}
.inside h2{font-family:var(--font-display);font-size:clamp(40px,7vw,84px);line-height:1.15;margin:0;color:var(--gold-2);text-shadow:0 6px 30px #000}
.inside p{margin:0;max-width:30em;font-size:19px;color:#fff;text-shadow:0 2px 10px #000}
.btn{background:var(--gold);color:#2a1d05;border:0;border-radius:14px;padding:14px 38px;font:700 19px var(--font-body);cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.4)}
.btn:hover{background:var(--gold-2)}
.skip{background:none;border:0;color:rgba(255,255,255,.75);text-decoration:underline;font-size:14.5px;cursor:pointer;margin-top:4px}

/* registration */

.rtabs{display:flex;gap:6px;margin:0 0 18px;background:rgba(255,255,255,.08);padding:4px;border-radius:999px}

/* overlay */
.ov{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(2,14,13,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

.card{position:relative;width:min(100%,900px);max-height:92svh;overflow:auto;display:grid;grid-template-columns:.85fr 1.15fr;gap:34px;align-items:center;background:var(--deep);border:2px solid var(--gold);border-radius:28px;padding:34px}

.opt{text-align:right;background:#fffaf0;border:1.5px solid #cdbb86;border-radius:12px;padding:10px 14px;font-size:16px;cursor:pointer;transition:transform .2s,background .2s;color:var(--ink)}
.opt:hover:not([disabled]){transform:translateX(-3px);background:#fff4d6}

.opt.no{background:#9b3838;border-color:#9b3838;color:#fff}
